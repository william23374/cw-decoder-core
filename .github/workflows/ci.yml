name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Unit + synth tests
        run: pytest -m "not real_audio"

  real-audio:
    name: Real HF QRQ (download + decode)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Download fixture from GitHub Release and decode
        env:
          CW_FIXTURE_REPO: william23374/cw-decoder-core
          CW_FIXTURE_TAG: fixtures-v1
          CW_FIXTURE_ASSET: w5uxh_k6kx_hf_qrq_45s_bp700.wav
          CW_FIXTURE_CACHE: ${{ runner.temp }}/cw-fixtures
          CW_FORCE_FREQ: "690"
          CW_FORCE_WPM: "72"
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: pytest -v -m real_audio --tb=short
        timeout-minutes: 15