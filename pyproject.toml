[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cw-decoder"
version = "13.3.0"
description = "Adaptive Morse code (CW) decoder for noisy audio — core DSP package"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

authors = [
    {name = "CW Decoder Team"},
]

keywords = ["morse", "cw", "decoder", "dsp", "ham-radio"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Communications :: Ham Radio",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "scikit-learn>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
cw-decoder = "cw_decoder.decoder:main"

[project.urls]
Homepage = "https://github.com/cw-decoder/cw-decoder-core"

[tool.setuptools.packages.find]
include = ["cw_decoder*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
